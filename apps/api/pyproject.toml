[project]
name = "promptproof-api"
version = "0.1.0"
description = "promptproof HTTP API"
requires-python = ">=3.12"
dependencies = [
    "promptproof-core",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv.sources]
promptproof-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptproof_api"]
