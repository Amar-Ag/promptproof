server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html must not be cached or a deploy
    # leaves clients pointing at assets that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths are the app's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Findings contain attacker-authored text. The app renders it as inert text,
    # and these headers are the second layer under that.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
