# The whole system, including its database. `make up` and nothing else.
#
# Four services: web, api, worker, db. No message broker — the `scans` table is
# the queue (ADR-0002).

name: promptproof

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promptproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promptproof}
      POSTGRES_DB: ${POSTGRES_DB:-promptproof}
    ports:
      # Exposed so tests and psql can reach it from the host.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` against the actual database, not just the port: this is what
      # api and worker gate their startup on.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promptproof} -d ${POSTGRES_DB:-promptproof}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-promptproof}:${POSTGRES_PASSWORD:-promptproof}@db:5432/${POSTGRES_DB:-promptproof}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEFAULT_TARGET_MODEL: ${DEFAULT_TARGET_MODEL:-qwen/qwen3.8-27b}
      JUDGE_MODEL: ${JUDGE_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SSRF_ALLOW_PRIVATE: ${SSRF_ALLOW_PRIVATE:-false}
      CORS_ALLOW_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
      ALERT_EVAL_INTERVAL_SECONDS: ${ALERT_EVAL_INTERVAL_SECONDS:-30}
      ALERT_ONCALL_WEBHOOK_URL: ${ALERT_ONCALL_WEBHOOK_URL:-}
      ALERT_HUMAN_WEBHOOK_URL: ${ALERT_HUMAN_WEBHOOK_URL:-}
      ONCALL_WEBHOOK_SECRET: ${ONCALL_WEBHOOK_SECRET:-}
      ONCALL_GITHUB_TOKEN: ${ONCALL_GITHUB_TOKEN:-}
      ONCALL_MODEL: ${ONCALL_MODEL:-qwen/qwen3.8-27b}
      # The on-call agent runs here and judges leases and attempts against these
      # numbers, so they must be the worker's numbers. When they drifted apart in
      # the first drill the agent reclaimed a scan the worker would never retry
      # and reported success. See docs/runbooks/stuck-queue.md.
      SCAN_LEASE_SECONDS: ${SCAN_LEASE_SECONDS:-300}
      SCAN_MAX_ATTEMPTS: ${SCAN_MAX_ATTEMPTS:-3}
      ONCALL_REPO: ${ONCALL_REPO:-Amar-Ag/promptproof}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["promptproof-worker"]
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-promptproof}:${POSTGRES_PASSWORD:-promptproof}@db:5432/${POSTGRES_DB:-promptproof}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEFAULT_TARGET_MODEL: ${DEFAULT_TARGET_MODEL:-qwen/qwen3.8-27b}
      JUDGE_MODEL: ${JUDGE_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-2}
      SCAN_LEASE_SECONDS: ${SCAN_LEASE_SECONDS:-300}
      SCAN_MAX_ATTEMPTS: ${SCAN_MAX_ATTEMPTS:-3}
      WORKER_ID: worker-1
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      db:
        condition: service_healthy
      # The API owns migrations; the worker starts once the schema exists.
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      # The whole app is mounted, not just src/, so changes to vite.config.ts,
      # tsconfig.json, eslint.config.js and package.json take effect too —
      # otherwise lint and typecheck silently run against the image's copy.
      - ./apps/web:/app
      # node_modules stays in a named volume, so it is the container's
      # `npm ci` output and the host never needs Node installed.
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # Not part of the running system: `profiles` keeps it out of `make up`.
  # It exists so the test suite runs in the same image the services do.
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      # A separate database, created on demand by the integration fixtures, so
      # running the suite never disturbs the data you were looking at.
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-promptproof}:${POSTGRES_PASSWORD:-promptproof}@db:5432/${POSTGRES_DB:-promptproof}
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      GROQ_API_KEY: test-key-not-used-by-any-test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  web_node_modules:
