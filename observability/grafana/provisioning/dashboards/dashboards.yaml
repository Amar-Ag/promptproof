# Loads any dashboard JSON mounted at /var/lib/grafana/dashboards.

apiVersion: 1

providers:
  - name: promptproof
    orgId: 1
    folder: promptproof
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
