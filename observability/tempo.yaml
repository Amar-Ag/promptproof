# Tempo, in its smallest useful configuration: one process, local disk, no
# object store. It keeps traces long enough to look at them, which is all this
# stack is for.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Traces are kept for an hour. This is a demonstration stack on a laptop, not
# an archive; a longer window just fills the volume.
compactor:
  compaction:
    block_retention: 1h
